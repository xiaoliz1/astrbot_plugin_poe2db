name: astrbot_plugin_poe2db
display_name: 流放之路2资料问答
short_desc: 搜索流放之路2词条、回答问题、分析 poe.ninja 公开角色构筑并查询物价。
desc: /poe2search 直接搜索词条并返回摘要、链接及 Poe2DB 可用图片；/poe2 根据检索资料回答问题，多个相近词条时先让提问者选择，并在匹配到 Poe2DB 图片时附图；/poe2bd 读取 poe.ninja 当前赛季公开 Builds 页面并让当前会话模型分析角色构筑，回复详情页链接；物价命令展示 14 类经济物品的神圣石价格图片，可每小时后台采集、手动采集并按时段通知指定群。
version: v1.14.0
author: xiaoliz1
repo: https://github.com/xiaoliz1/astrbot_plugin_poe2db
astrbot_version: ">=4.24.2,<5"
