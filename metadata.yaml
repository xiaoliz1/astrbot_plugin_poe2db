name: astrbot_plugin_poe2db
display_name: 流放之路2资料问答
short_desc: 搜索流放之路2词条并回答问题，支持词条配图、物价手动采集和定时推送。
desc: /poe2search 直接搜索词条并返回摘要、链接及 Poe2DB 可用图片；/poe2 根据检索资料回答问题，多个相近词条时先让提问者选择，并在匹配到 Poe2DB 图片时附图；/poe2bd 返回 poe.ninja 当前赛季的角色筛选页链接；物价命令展示 14 类经济物品的神圣石价格图片，可每小时后台采集、手动采集并按时段通知指定群。
version: v1.12.1
author: xiaoliz1
repo: https://github.com/xiaoliz1/astrbot_plugin_poe2db
astrbot_version: ">=4.24.2,<5"
